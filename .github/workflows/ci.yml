name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Blocking gate. Everything here genuinely passes today.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders — the real values live in the deploy env.
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci

  # Blocking. This was continue-on-error while the suite was red: it had never
  # executed in CI (the lint step failed ahead of it), and running it surfaced
  # both wrong expectations in the specs and real app bugs. Both are fixed, so
  # the suite gates merges like any other check.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # No --with-deps: that runs apt-get, which stalled for 14+ minutes on
      # this runner. ubuntu-latest already ships the shared libraries Chromium
      # needs, so only the browser itself has to be fetched.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci
      - run: npm run test:e2e
        env:
          # Playwright starts and waits on the server itself — see
          # playwright.config.ts, which uses `npm start` when CI is set.
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci
          # Unreachable on purpose. The suite only covers paths that reject a
          # request before any query runs, but the routes still need the vars to
          # be present — supabaseAdmin() throws when they are missing, which
          # would turn an expected 401 into a 500.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          STRIPE_SECRET_KEY: sk_test_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
