<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forma — AI-Powered Template Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap"
    />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: #0e0b07;
        color: #ede8dc;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 2px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(200, 145, 90, 0.4);
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      @keyframes fadeUp {
        from {
          transform: translateY(14px);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
        }
        to {
        }
      }
      @keyframes spinRing {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes shimmer {
        0% {
          background-position: -400px 0;
        }
        100% {
          background-position: 400px 0;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.08);
        }
      }
      @keyframes drift1 {
        0%,
        100% {
          transform: translate(0, 0) rotate(-1deg);
        }
        50% {
          transform: translate(6px, -12px) rotate(1deg);
        }
      }
      @keyframes drift2 {
        0%,
        100% {
          transform: translate(0, 0) rotate(1deg);
        }
        50% {
          transform: translate(-8px, -8px) rotate(-1deg);
        }
      }
      @keyframes drift3 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(4px, -16px);
        }
      }
      @keyframes heartPop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.5);
        }
        65% {
          transform: scale(0.85);
        }
        100% {
          transform: scale(1);
        }
      }
      .screen-enter {
        animation: fadeUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const C = {
        accent: "#C8915A",
        accentRgb: "200,145,90",
        terra: "#9C6B3C",
        text: "#EDE8DC",
        muted: "rgba(237,232,220,.55)",
        mutedDim: "rgba(237,232,220,.35)",
        bg: "#0E0B07",
        surface: "rgba(28,22,16,.9)",
        surface2: "rgba(36,30,22,.95)",
        card: "rgba(24,19,13,.85)",
        border: "rgba(237,232,220,.07)",
        borderGold: "rgba(200,145,90,.25)",
        inputBg: "rgba(237,232,220,.05)",
        navBg: "rgba(14,11,7,.92)",
        success: "#7AAF4A",
        obsidian2: "#1E1A14",
      };
      const F = {
        heading: "'Montserrat',sans-serif",
        body: "'Plus Jakarta Sans',sans-serif",
        display: "'Fraunces',serif",
        editorial: "'Cormorant Garamond',serif",
      };
      const SEIGAIHA = `url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='30'><circle cx='30' cy='30' r='30' fill='none' stroke='%23C8915A' stroke-width='.6' stroke-opacity='.07'/><circle cx='0' cy='30' r='30' fill='none' stroke='%23C8915A' stroke-width='.6' stroke-opacity='.07'/><circle cx='60' cy='30' r='30' fill='none' stroke='%23C8915A' stroke-width='.6' stroke-opacity='.07'/><circle cx='30' cy='0' r='30' fill='none' stroke='%23C8915A' stroke-width='.6' stroke-opacity='.07'/></svg>")`;

      const TEMPLATES = [
        {
          id: "t1",
          name: "SaaS Dashboard",
          desc: "Admin panel con dark mode",
          price: 1999,
          type: "html",
          tag: "UI",
          isNew: true,
        },
        {
          id: "t2",
          name: "Pitch Deck Pro",
          desc: "20 slide per investitori",
          price: 1499,
          type: "canva",
          tag: "Canva",
          pick: true,
        },
        {
          id: "t3",
          name: "Budget Planner",
          desc: "Tracker spese annuale",
          price: 0,
          type: "sheets",
          tag: "Sheets",
        },
        {
          id: "t4",
          name: "Landing Page Kit",
          desc: "Hero, pricing, CTA",
          price: 2499,
          type: "html",
          tag: "UI",
          isNew: true,
        },
        {
          id: "t5",
          name: "Prompt Pack AI",
          desc: "50 prompt per Claude",
          price: 999,
          type: "notion",
          tag: "Prompt",
        },
        {
          id: "t6",
          name: "Portfolio Minimal",
          desc: "Single-page portfolio",
          price: 1299,
          type: "html",
          tag: "UI",
        },
        {
          id: "t7",
          name: "E-commerce Kit",
          desc: "Product listing + checkout",
          price: 2999,
          type: "webflow",
          tag: "Webflow",
          pick: true,
        },
        {
          id: "t8",
          name: "Notion HQ",
          desc: "Workspace produttività",
          price: 1499,
          type: "notion",
          tag: "Notion",
        },
      ];
      const PLAT = {
        html: { color: "#C8915A", label: "HTML" },
        canva: { color: "#7B61FF", label: "Canva" },
        sheets: { color: "#0F9D58", label: "Sheets" },
        notion: { color: "#888", label: "Notion" },
        webflow: { color: "#4353FF", label: "Webflow" },
        framer: { color: "#0055FF", label: "Framer" },
      };
      const fmt = (c) => (c === 0 ? "Gratis" : `€${(c / 100).toFixed(2)}`);

      /* ── CARD MOCK THUMBNAILS ── */
      function CardThumb({ t, hovered }) {
        const p = PLAT[t.type] || PLAT.html;
        const bars = [
          { top: 14, left: 14, w: "55%", h: 8, op: 0.18 },
          { top: 28, left: 14, w: "75%", h: 5, op: 0.1 },
          { top: 38, left: 14, w: "45%", h: 5, op: 0.08 },
        ];
        // colored block bottom-left
        return (
          <div
            style={{
              position: "relative",
              height: 148,
              overflow: "hidden",
              background: `linear-gradient(150deg,${p.color}18,rgba(14,11,7,.8))`,
            }}
          >
            {bars.map((b, i) => (
              <div
                key={i}
                style={{
                  position: "absolute",
                  top: b.top,
                  left: b.left,
                  width: b.w,
                  height: b.h,
                  background: C.text,
                  opacity: b.op,
                }}
              />
            ))}
            <div
              style={{
                position: "absolute",
                bottom: 12,
                left: 12,
                width: 28,
                height: 28,
                background: `${p.color}33`,
                border: `1px solid ${p.color}55`,
              }}
            />
            {/* gradient overlay */}
            <div
              style={{
                position: "absolute",
                inset: 0,
                background: "linear-gradient(to bottom,transparent 30%,rgba(8,5,2,.85) 100%)",
              }}
            />
            {/* platform badge */}
            <div
              style={{
                position: "absolute",
                top: 8,
                left: 8,
                background: "rgba(0,0,0,.55)",
                backdropFilter: "blur(6px)",
                border: "1px solid rgba(255,255,255,.1)",
                padding: "2px 7px",
              }}
            >
              <span
                style={{
                  fontFamily: F.heading,
                  fontSize: 8,
                  fontWeight: 700,
                  letterSpacing: ".14em",
                  textTransform: "uppercase",
                  color: "rgba(255,255,255,.82)",
                }}
              >
                {p.label}
              </span>
            </div>
            {t.pick && (
              <div
                style={{
                  position: "absolute",
                  top: 8,
                  right: 8,
                  background: C.accent,
                  padding: "2px 7px",
                }}
              >
                <span
                  style={{
                    fontFamily: F.heading,
                    fontSize: 8,
                    fontWeight: 700,
                    letterSpacing: ".1em",
                    textTransform: "uppercase",
                    color: "#0d0a06",
                  }}
                >
                  ✦ Staff
                </span>
              </div>
            )}
            {t.isNew && !t.pick && (
              <div
                style={{
                  position: "absolute",
                  top: 8,
                  right: 8,
                  background: "rgba(0,0,0,.5)",
                  border: "1px solid rgba(255,255,255,.15)",
                  padding: "2px 7px",
                }}
              >
                <span
                  style={{
                    fontFamily: F.heading,
                    fontSize: 8,
                    fontWeight: 700,
                    letterSpacing: ".1em",
                    textTransform: "uppercase",
                    color: "rgba(255,255,255,.85)",
                  }}
                >
                  Nuovo
                </span>
              </div>
            )}
            {t.id === "t3" && (
              <div
                style={{
                  position: "absolute",
                  bottom: 8,
                  left: 8,
                  background: C.success,
                  padding: "2px 8px",
                  display: "flex",
                  alignItems: "center",
                  gap: 4,
                }}
              >
                <svg width="9" height="9" viewBox="0 0 12 12" fill="none">
                  <path
                    d="M2 6l2.8 3 5.2-5"
                    stroke="white"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                </svg>
                <span
                  style={{ fontFamily: F.body, fontSize: 9, fontWeight: 600, color: "#0d0a06" }}
                >
                  Acquistato
                </span>
              </div>
            )}
            {/* hover overlay */}
            <div
              style={{
                position: "absolute",
                inset: 0,
                background: hovered ? "rgba(0,0,0,.32)" : "rgba(0,0,0,0)",
                transition: "background .25s",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
              }}
            >
              {hovered && (
                <span
                  style={{
                    fontFamily: F.heading,
                    fontSize: 9,
                    fontWeight: 700,
                    textTransform: "uppercase",
                    letterSpacing: ".16em",
                    color: "rgba(255,255,255,.9)",
                    background: "rgba(0,0,0,.5)",
                    padding: "5px 12px",
                    border: "1px solid rgba(255,255,255,.22)",
                    backdropFilter: "blur(4px)",
                  }}
                >
                  Preview
                </span>
              )}
            </div>
          </div>
        );
      }

      function TemplateCard({ t, onClick }) {
        const [hov, setHov] = React.useState(false);
        const [liked, setLiked] = React.useState(false);
        const [pop, setPop] = React.useState(false);
        const toggleLike = (e) => {
          e.stopPropagation();
          setLiked((v) => !v);
          setPop(true);
          setTimeout(() => setPop(false), 380);
        };
        return (
          <div
            onClick={() => onClick(t)}
            onMouseEnter={() => setHov(true)}
            onMouseLeave={() => setHov(false)}
            style={{
              position: "relative",
              background: C.card,
              border: `1px solid ${hov ? C.borderGold : C.border}`,
              cursor: "pointer",
              display: "flex",
              flexDirection: "column",
              transition: `transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease,border-color .2s`,
              transform: hov ? "translateY(-4px)" : "none",
              boxShadow: hov ? "0 20px 60px rgba(0,0,0,.6)" : "0 2px 10px rgba(0,0,0,.3)",
            }}
          >
            {/* gold sweep */}
            <div
              style={{
                position: "absolute",
                top: 0,
                left: 0,
                right: 0,
                height: 2,
                background: `linear-gradient(90deg,${C.accent},${C.terra})`,
                transform: hov ? "scaleX(1)" : "scaleX(0)",
                transformOrigin: "left",
                transition: "transform .32s cubic-bezier(.22,1,.36,1)",
                zIndex: 5,
              }}
            />
            <CardThumb t={t} hovered={hov} />
            <div
              style={{
                padding: "12px 14px 14px",
                borderTop: `1px solid ${C.border}`,
                flex: 1,
                display: "flex",
                flexDirection: "column",
              }}
            >
              <h3
                style={{
                  fontFamily: F.heading,
                  fontSize: 13,
                  fontWeight: 600,
                  letterSpacing: "-.01em",
                  color: C.text,
                  margin: "0 0 4px",
                }}
              >
                {t.name}
              </h3>
              <p
                style={{
                  fontFamily: F.body,
                  fontSize: 11,
                  color: C.muted,
                  margin: 0,
                  lineHeight: 1.5,
                  flex: 1,
                }}
              >
                {t.desc}
              </p>
              <div
                style={{
                  marginTop: 10,
                  paddingTop: 10,
                  borderTop: `1px solid ${C.border}`,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                }}
              >
                <span
                  style={{
                    fontFamily: F.display,
                    fontSize: 20,
                    color: C.accent,
                    lineHeight: 1,
                    fontStyle: "italic",
                  }}
                >
                  {fmt(t.price)}
                </span>
                <button
                  onClick={toggleLike}
                  style={{
                    background: "none",
                    border: "none",
                    padding: 2,
                    cursor: "pointer",
                    color: liked ? C.terra : C.mutedDim,
                    transition: "color .2s",
                    animation: pop ? "heartPop .38s cubic-bezier(.34,1.56,.64,1) both" : "none",
                  }}
                >
                  <svg
                    width="13"
                    height="13"
                    viewBox="0 0 14 14"
                    fill={liked ? "currentColor" : "none"}
                  >
                    <path
                      d="M7 12S1 8 1 4.5A3.5 3.5 0 017 2.1a3.5 3.5 0 016 2.4C13 8 7 12 7 12z"
                      stroke="currentColor"
                      strokeWidth="1.4"
                      strokeLinejoin="round"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        );
      }

      /* ── NAV ── */
      function Nav({ screen, go }) {
        const links = [
          ["home", "Catalogo"],
          ["preview", "Template"],
          ["studio", "AI Studio"],
          ["account", "Account"],
        ];
        return (
          <nav
            style={{
              flexShrink: 0,
              display: "flex",
              alignItems: "center",
              gap: 4,
              padding: "10px 28px",
              background: C.navBg,
              borderBottom: `1px solid ${C.border}`,
              backdropFilter: "blur(24px)",
              zIndex: 100,
            }}
          >
            <div
              onClick={() => go("home")}
              style={{ marginRight: 20, cursor: "pointer", flexShrink: 0 }}
            >
              <div
                style={{
                  fontFamily: F.heading,
                  fontWeight: 800,
                  fontSize: 16,
                  letterSpacing: ".06em",
                  textTransform: "uppercase",
                  color: C.text,
                  lineHeight: 1,
                }}
              >
                For<span style={{ color: C.accent }}>ma</span>
              </div>
              <div
                style={{
                  fontFamily: F.heading,
                  fontSize: 9,
                  letterSpacing: ".14em",
                  textTransform: "uppercase",
                  color: C.accent,
                  fontWeight: 500,
                  marginTop: 2,
                  opacity: 0.85,
                }}
              >
                Artisan digital marketplace
              </div>
            </div>
            {links.map(([id, label]) => {
              const active = screen === id;
              return (
                <button
                  key={id}
                  onClick={() => go(id)}
                  style={{
                    fontFamily: F.heading,
                    fontSize: 10,
                    fontWeight: 500,
                    textTransform: "uppercase",
                    letterSpacing: ".1em",
                    color: active ? C.text : C.muted,
                    background: "none",
                    border: "none",
                    cursor: "pointer",
                    padding: "6px 12px",
                    position: "relative",
                    transition: "color .2s",
                  }}
                >
                  {label}
                  {active && (
                    <span
                      style={{
                        position: "absolute",
                        bottom: 1,
                        left: "50%",
                        transform: "translateX(-50%)",
                        width: 4,
                        height: 4,
                        borderRadius: "50%",
                        background: C.accent,
                        boxShadow: `0 0 8px ${C.accent}`,
                      }}
                    />
                  )}
                </button>
              );
            })}
            <div style={{ flex: 1 }} />
            {/* search */}
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 7,
                padding: "5px 10px",
                border: `1px solid ${C.border}`,
                background: C.inputBg,
                marginRight: 8,
              }}
            >
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
                <circle
                  cx="11"
                  cy="11"
                  r="7"
                  stroke="currentColor"
                  strokeWidth="1.8"
                  style={{ color: C.muted }}
                />
                <path
                  d="M20 20l-3.5-3.5"
                  stroke="currentColor"
                  strokeWidth="1.8"
                  strokeLinecap="round"
                  style={{ color: C.muted }}
                />
              </svg>
              <span
                style={{
                  fontFamily: F.heading,
                  fontSize: 10,
                  letterSpacing: ".1em",
                  color: C.muted,
                }}
              >
                Cerca
              </span>
              <span
                style={{
                  fontFamily: F.heading,
                  fontSize: 8,
                  fontWeight: 700,
                  padding: "1px 5px",
                  border: `1px solid ${C.border}`,
                  background: "rgba(237,232,220,.03)",
                  color: C.muted,
                }}
              >
                ⌘K
              </span>
            </div>
            {/* Claude badge */}
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 5,
                padding: "4px 9px",
                border: `1px solid ${C.borderGold}`,
                background: "rgba(200,145,90,.09)",
                marginRight: 8,
              }}
            >
              <svg width="8" height="8" viewBox="0 0 10 10" fill="none">
                <path
                  d="M5 1l1.1 2.3L9 4l-2 1.8.5 2.5L5 7.2 2.5 8.3 3 5.8 1 4l2.9-.7L5 1z"
                  fill={C.accent}
                />
              </svg>
              <span
                style={{
                  fontFamily: F.heading,
                  fontSize: 9,
                  fontWeight: 700,
                  letterSpacing: ".12em",
                  textTransform: "uppercase",
                  color: C.accent,
                }}
              >
                Claude AI
              </span>
            </div>
            <button
              onClick={() => go("studio")}
              style={{
                fontFamily: F.heading,
                fontWeight: 700,
                fontSize: 9,
                textTransform: "uppercase",
                letterSpacing: ".14em",
                background: C.accent,
                color: "#0d0a06",
                padding: "7px 16px",
                border: "none",
                cursor: "pointer",
                marginRight: 10,
                transition: "background .2s",
              }}
            >
              Studio
            </button>
            <div
              onClick={() => go("account")}
              style={{
                width: 28,
                height: 28,
                borderRadius: "50%",
                background: "rgba(200,145,90,.2)",
                border: `1px solid ${C.borderGold}`,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontFamily: F.display,
                fontSize: 13,
                color: C.accent,
              }}
            >
              形
            </div>
          </nav>
        );
      }

      /* ── HOME SCREEN ── */
      function HomeScreen({ go, setTpl }) {
        const [filter, setFilter] = React.useState("Tutti");
        const filters = ["Tutti", "UI", "Prompt", "Canva", "Notion", "Sheets", "Webflow"];
        const shown = filter === "Tutti" ? TEMPLATES : TEMPLATES.filter((t) => t.tag === filter);
        const click = (t) => {
          setTpl(t);
          go("preview");
        };

        return (
          <div>
            {/* ─ HERO ─ */}
            <section
              style={{
                position: "relative",
                overflow: "hidden",
                padding: "90px 32px 80px",
                textAlign: "center",
                borderBottom: `1px solid ${C.border}`,
                backgroundImage: SEIGAIHA,
                backgroundSize: "60px 30px",
              }}
            >
              <div
                style={{
                  position: "absolute",
                  top: "20%",
                  left: "50%",
                  transform: "translateX(-50%)",
                  width: 700,
                  height: 350,
                  background: `radial-gradient(ellipse, rgba(${C.accentRgb},.13) 0%, transparent 70%)`,
                  pointerEvents: "none",
                  animation: "pulse 6s ease-in-out infinite",
                }}
              />

              {/* Torii accent */}
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 4,
                  opacity: 0.4,
                  marginBottom: 24,
                }}
              >
                <div style={{ height: 1, width: 52, background: C.accent }} />
                <div style={{ height: 1, width: 34, background: C.accent }} />
              </div>

              <div
                style={{
                  fontFamily: F.heading,
                  fontSize: 10,
                  fontWeight: 700,
                  letterSpacing: ".22em",
                  textTransform: "uppercase",
                  color: C.accent,
                  marginBottom: 20,
                  animation: "none",
                }}
              >
                AI-Powered Template Marketplace
              </div>

              <h1
                style={{

                    <div style={{ display: "flex", gap: 8 }}>

      /* ── APP SHELL ── */
      function App() {
        const [screen, setScreen] = React.useState("home");
        const [tpl, setTpl] = React.useState(null);
        const scrollRef = React.useRef(null);

        const go = (s) => {
          setScreen(s);
          if (scrollRef.current) scrollRef.current.scrollTop = 0;
        };

        const screens = {
          home: <HomeScreen go={go} setTpl={setTpl} />,
          preview: <PreviewScreen tpl={tpl || TEMPLATES[0]} go={go} />,
          studio: <StudioScreen go={go} />,
          account: <AccountScreen />,
        };

        return (
          <div style={{ display: "flex", flexDirection: "column", height: "100vh" }}>
            <Nav screen={screen} go={go} />
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto" }}>
              <div key={screen} className="screen-enter">
                {screens[screen] || screens.home}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
