<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;600&family=Fraunces:ital,opsz,wght@1,144,300;1,144,400&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=DM+Serif+Display:ital@1&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 16px 20px;
        background: #14100c;
        color: #ede8dc;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .display {
        font-family: "Fraunces", serif;
        font-style: italic;
        font-size: 42px;
        line-height: 1;
        letter-spacing: -0.035em;
        color: #ede8dc;
      }
      .display em {
        color: #c8915a;
        font-style: italic;
      }
      .label {
        font-family: "Montserrat", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #c8915a;
        margin-top: 10px;
        margin-bottom: 2px;
      }
      .h1 {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: #ede8dc;
      }
      .h2 {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: #ede8dc;
      }
      .h3 {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.015em;
        color: #ede8dc;
      }
      .editorial {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 22px;
        font-weight: 300;
        color: rgba(237, 232, 220, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="label">Display · Fraunces Italic</div>
    <div class="display">Premium <em>templates</em></div>
    <div class="label">H1 · Montserrat 700</div>
    <div class="h1">Artisan digital marketplace</div>
    <div class="label">H2 · Montserrat 700</div>
    <div class="h2">Browse AI-powered templates</div>
    <div class="label">H3 · Montserrat 700</div>
    <div class="h3">UI Kit — Landing Page</div>
    <div class="label">Editorial · Cormorant Garamond Italic</div>
    <div class="editorial">「 Kanso 」simplicity · naturalness · tranquility</div>
  </body>
</html>
