<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:18px 20px; background:#14100C; font-family:'Plus Jakarta Sans',sans-serif; }
  .label { font-family:'Montserrat',sans-serif; font-size:9px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#C8915A; margin-bottom:10px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .btn-brand {
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:10px;
    text-transform:uppercase; letter-spacing:0.14em;
    background:#C8915A; color:#14100C;
    padding:12px 28px; border:none; cursor:pointer;
    position:relative; overflow:hidden;
  }
  .btn-brand-sm { padding:7px 14px; font-size:9px; }
  .btn-ghost {
    display:inline-flex; align-items:center;
    font-family:'Montserrat',sans-serif; font-weight:600; font-size:10px;
    text-transform:uppercase; letter-spacing:0.12em;
    background:transparent; color:rgba(237,232,220,0.7);
    padding:10px 20px; border:1px solid rgba(237,232,220,0.22); cursor:pointer;
  }
  .btn-text {
    font-family:'Montserrat',sans-serif; font-weight:600; font-size:10px;
    text-transform:uppercase; letter-spacing:0.12em;
    background:none; border:none; color:#C8915A; cursor:pointer;
    padding:0; position:relative;
  }
  .btn-text::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:1px; background:#C8915A; transition:width 0.3s; }
  .btn-destructive { background:rgba(156,107,60,0.2); color:#C8915A; border:1px solid rgba(200,145,90,0.3); }
  .badge { display:inline-flex; align-items:center; padding:3px 8px; font-size:9px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; }
  .badge-accent { background:rgba(200,145,90,0.15); color:#C8915A; border:1px solid rgba(200,145,90,0.3); }
  .badge-success { background:rgba(122,175,74,0.15); color:#7AAF4A; border:1px solid rgba(122,175,74,0.3); }
  .badge-new { background:#C8915A; color:#14100C; }
  .badge-staff { background:rgba(200,145,90,0.9); color:#14100C; }
</style>
</head>
<body>
<div class="label">Primary CTA — btn-brand</div>
<div class="row">
  <button class="btn-brand">Acquista Ora</button>
  <button class="btn-brand btn-brand-sm">Studio</button>
  <button class="btn-brand" disabled style="opacity:0.4;cursor:not-allowed">Caricamento...</button>
</div>
<div class="label">Ghost + Text Buttons</div>
<div class="row">
  <button class="btn-ghost">Anteprima</button>
  <button class="btn-ghost" style="border-color:rgba(200,145,90,0.4);color:#C8915A">Personalizza</button>
  <button class="btn-text">Scopri →</button>
</div>
<div class="label">Badges</div>
<div class="row">
  <span class="badge badge-accent">HTML</span>
  <span class="badge badge-new">Nuovo</span>
  <span class="badge badge-staff">✦ Staff Pick</span>
  <span class="badge badge-success">Acquistato</span>
  <span class="badge" style="background:rgba(123,97,255,0.15);color:#7B61FF;border:1px solid rgba(123,97,255,0.3)">Canva</span>
</div>
</body></html>
