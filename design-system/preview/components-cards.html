<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400&family=Fraunces:ital,opsz,wght@0,144,400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 16px 20px;
        background: #14100c;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .label {
        font-family: "Montserrat", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #c8915a;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        gap: 14px;
      }
      .card {
        background: rgba(30, 26, 20, 0.65);
        border: 1px solid rgba(237, 232, 220, 0.09);
        width: 170px;
        overflow: hidden;
        flex-shrink: 0;
        position: relative;
      }
      .card-img {
        height: 90px;
        background: linear-gradient(145deg, #2a1f14, #1a1208);
        position: relative;
        overflow: hidden;
      }
      .card-img-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
        justify-content: flex-end;
      }
      .card-body {
        padding: 10px 12px 12px;
      }
      .card-title {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: -0.01em;
        color: #ede8dc;
        margin-bottom: 4px;
      }
      .card-desc {
        font-size: 10px;
        color: rgba(237, 232, 220, 0.5);
        line-height: 1.5;
        margin-bottom: 8px;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 8px;
        border-top: 1px solid rgba(237, 232, 220, 0.07);
      }
      .price {
        font-family: "Fraunces", serif;
        font-size: 18px;
        color: #c8915a;
        line-height: 1;
      }
      .heart {
        width: 13px;
        height: 13px;
        color: rgba(237, 232, 220, 0.3);
      }
      /* Card top-border sweep */
      .card-sweep::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, #c8915a, #9c6b3c);
      }
      /* Platform badge */
      .platform-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        background: rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 2px 5px;
      }
      .platform-label {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }
      /* Shimmer block elements */
      .blk {
        background: rgba(237, 232, 220, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="label">Template Card — Default + Hover (card-sweep)</div>
    <div class="row">
      <!-- Card 1: default -->
      <div class="card">
        <div class="card-img">
          <div
            style="
              position: absolute;
              inset: 0;
              background: linear-gradient(145deg, #1a1208cc, #0d0904cc);
            "
          ></div>
          <div
            class="blk"
            style="position: absolute; top: 12px; left: 12px; right: 12px; height: 10px"
          ></div>
          <div
            class="blk"
            style="position: absolute; top: 28px; left: 12px; width: 70%; height: 6px; opacity: 0.5"
          ></div>
          <div
            class="blk"
            style="
              position: absolute;
              bottom: 12px;
              left: 12px;
              width: 40px;
              height: 20px;
              background: rgba(200, 145, 90, 0.4);
            "
          ></div>
          <div class="platform-badge"><span class="platform-label">HTML</span></div>
        </div>
        <div class="card-body">
          <div class="card-title">SaaS Landing Page</div>
          <div class="card-desc">Fully responsive with dark mode</div>
          <div class="card-footer">
            <span class="price">€12.99</span>
            <svg class="heart" viewBox="0 0 14 14" fill="none">
              <path
                d="M7 12S1 8 1 4.5A3.5 3.5 0 017 2.1a3.5 3.5 0 016 2.4C13 8 7 12 7 12z"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </div>
      <!-- Card 2: hover state (card-sweep) -->
      <div class="card card-sweep" style="box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5)">
        <div class="card-img" style="background: linear-gradient(145deg, #7b61ff44, #1a1208)">
          <div
            style="
              position: absolute;
              inset: 0;
              background: linear-gradient(to bottom, transparent 20%, rgba(0, 0, 0, 0.6) 100%);
            "
          ></div>
          <div class="platform-badge">
            <span class="platform-label" style="color: #a89cf7">Canva</span>
          </div>
          <div
            style="position: absolute; top: 6px; right: 6px; background: #c8915a; padding: 2px 5px"
          >
            <span
              style="
                font-size: 8px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: #14100c;
              "
              >✦ Staff</span
            >
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">Pitch Deck Pro</div>
          <div class="card-desc">20 slides, investor-ready</div>
          <div class="card-footer">
            <span class="price">€19.99</span>
            <svg class="heart" viewBox="0 0 14 14" fill="none" style="color: #9c6b3c">
              <path
                d="M7 12S1 8 1 4.5A3.5 3.5 0 017 2.1a3.5 3.5 0 016 2.4C13 8 7 12 7 12z"
                stroke="currentColor"
                stroke-width="1.4"
                fill="currentColor"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </div>
      <!-- Card 3: purchased -->
      <div class="card">
        <div class="card-img" style="background: linear-gradient(145deg, #1d6f4244, #0d1a10)">
          <div
            style="
              position: absolute;
              inset: 0;
              background: linear-gradient(to bottom, transparent 20%, rgba(0, 0, 0, 0.6) 100%);
            "
          ></div>
          <div class="platform-badge">
            <span class="platform-label" style="color: #0f9d58">Sheets</span>
          </div>
          <span
            style="
              position: absolute;
              bottom: 8px;
              left: 8px;
              background: #5a7a32;
              color: #ede8dc;
              font-size: 9px;
              font-weight: 600;
              padding: 3px 8px;
              display: flex;
              align-items: center;
              gap: 4px;
            "
            >✓ Acquistato</span
          >
        </div>
        <div class="card-body">
          <div class="card-title">Budget Planner 2025</div>
          <div class="card-desc">12-month expense tracker</div>
          <div class="card-footer">
            <span class="price">Gratis</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
