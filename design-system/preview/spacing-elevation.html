<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Plus+Jakarta+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #14100c;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .label {
        font-family: "Montserrat", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #c8915a;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: flex-end;
      }
      .card {
        background: rgba(30, 26, 20, 0.9);
        width: 80px;
        height: 60px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 8px;
      }
      .name {
        font-size: 9px;
        color: rgba(237, 232, 220, 0.5);
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="label">Elevation — 5-Step Shadow Scale (Dark)</div>
    <div class="row">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div
          class="card"
          style="
            box-shadow:
              0 1px 2px rgba(0, 0, 0, 0.4),
              0 1px 1px rgba(0, 0, 0, 0.24);
          "
        ></div>
        <div class="name">elev-1</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div
          class="card"
          style="
            box-shadow:
              0 2px 6px rgba(0, 0, 0, 0.55),
              0 1px 2px rgba(0, 0, 0, 0.3);
          "
        ></div>
        <div class="name">elev-2</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div
          class="card"
          style="
            box-shadow:
              0 8px 24px rgba(0, 0, 0, 0.6),
              0 2px 6px rgba(0, 0, 0, 0.35);
          "
        ></div>
        <div class="name">elev-3</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div
          class="card"
          style="
            box-shadow:
              0 20px 50px rgba(0, 0, 0, 0.7),
              0 4px 12px rgba(0, 0, 0, 0.4);
          "
        ></div>
        <div class="name">elev-4</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div
          class="card"
          style="
            box-shadow:
              0 40px 100px rgba(0, 0, 0, 0.85),
              0 8px 24px rgba(0, 0, 0, 0.45);
          "
        ></div>
        <div class="name">elev-5</div>
      </div>
    </div>
  </body>
</html>
