<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Fraunces:opsz,wght@144,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:16px 20px; background:#14100C; font-family:'Plus Jakarta Sans',sans-serif; color:#EDE8DC; }
  .label { font-family:'Montserrat',sans-serif; font-size:9px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#C8915A; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
  /* zen-divider */
  .zen-divider { display:flex;align-items:center;gap:14px;width:100%;opacity:0.60; }
  .zen-divider::before,.zen-divider::after { content:'';flex:1;height:1px; }
  .zen-divider::before { background:linear-gradient(to right,transparent,#C8915A); }
  .zen-divider::after  { background:linear-gradient(to left, transparent,#C8915A); }
  .zen-divider span { font-size:10px;color:#C8915A;flex-shrink:0;line-height:1; }
  /* wax-seal */
  .wax-seal { position:relative;display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4a070,#C8915A 60%,#9a6030 100%);color:#0d0a06;box-shadow:inset 0 1px 1px rgba(255,255,255,0.3),inset 0 -2px 4px rgba(0,0,0,0.25),0 8px 24px rgba(0,0,0,0.6);font-family:'Fraunces',serif;font-weight:600;font-size:13px;transform:rotate(-6deg); }
  .wax-seal::before { content:'';position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(255,255,255,0.35); }
  /* mon-ring */
  .mon-ring { width:36px;height:36px;border-radius:50%;border:1px solid #C8915A;display:flex;align-items:center;justify-content:center;font-size:7px;color:#C8915A;opacity:0.5; }
  /* hanko-seal */
  .hanko-seal { width:32px;height:32px;border:1px solid #C8915A;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:13px;color:#C8915A;opacity:0.55;transform:rotate(-3deg); }
  /* tategaki */
  .tategaki { writing-mode:vertical-rl;text-orientation:mixed;font-family:'Cormorant Garamond',serif;font-size:11px;color:#C8915A;opacity:0.5;letter-spacing:0.25em; }
  /* torii */
  .torii-accent { display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0.45; }
  .torii-accent::before { content:'';display:block;height:1px;width:48px;background:#C8915A; }
  .torii-accent::after  { content:'';display:block;height:1px;width:32px;background:#C8915A; }
  /* ink-line */
  .ink-line { position:relative;display:inline-block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#EDE8DC; }
  .ink-line::after { content:'';position:absolute;bottom:-5px;left:0;width:38%;height:1px;background:linear-gradient(to right,#C8915A,transparent);opacity:0.5; }
</style>
</head>
<body>
<div class="label">Zen Divider · Ma Divider</div>
<div class="zen-divider"><span>◇</span></div>
<div class="label">Wax Seal · Mon Ring · Hanko Seal · Tategaki · Torii</div>
<div class="row">
  <div class="wax-seal">€12</div>
  <div class="mon-ring">◆</div>
  <div class="hanko-seal">印</div>
  <div class="tategaki">Forma Design</div>
  <div class="torii-accent"></div>
  <span style="font-family:'Fraunces',serif;font-size:42px;color:#C8915A;opacity:0.25;line-height:1">形</span>
</div>
<div class="label">Ink-Line Heading</div>
<div class="ink-line">Artisan Templates</div>
</body></html>
