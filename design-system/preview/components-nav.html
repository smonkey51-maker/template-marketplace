<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #14100c;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 10px 20px;
        background: rgba(28, 24, 20, 0.93);
        border-bottom: 1px solid rgba(237, 232, 220, 0.09);
        backdrop-filter: blur(24px);
      }
      .logo {
        margin-right: 16px;
        flex-shrink: 0;
      }
      .logo-text {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #ede8dc;
        line-height: 1;
      }
      .logo-sub {
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #c8915a;
        font-weight: 500;
        margin-top: 2px;
      }
      .nav-link {
        font-family: "Montserrat", sans-serif;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(237, 232, 220, 0.55);
        padding: 6px 12px;
        position: relative;
        text-decoration: none;
      }
      .nav-link.active {
        color: #ede8dc;
      }
      .nav-link.active::after {
        content: "";
        position: absolute;
        bottom: 1px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #c8915a;
        box-shadow: 0 0 8px #c8915a;
      }
      .spacer {
        flex: 1;
      }
      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border: 1px solid rgba(237, 232, 220, 0.12);
        background: rgba(237, 232, 220, 0.05);
        margin-right: 8px;
      }
      .search-text {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        color: rgba(237, 232, 220, 0.4);
      }
      .kbd {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 1px 5px;
        border: 1px solid rgba(237, 232, 220, 0.15);
        color: rgba(237, 232, 220, 0.4);
        background: rgba(237, 232, 220, 0.04);
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border: 1px solid rgba(200, 145, 90, 0.3);
        background: rgba(200, 145, 90, 0.1);
      }
      .badge-text {
        font-family: "Montserrat", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8915a;
      }
      .btn-studio {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        background: #c8915a;
        color: #14100c;
        padding: 7px 14px;
        border: none;
        margin-right: 8px;
        cursor: pointer;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(200, 145, 90, 0.25);
        border: 1px solid rgba(200, 145, 90, 0.4);
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">
        <div class="logo-text">For<span style="color: #c8915a">ma</span></div>
        <div class="logo-sub">Artisan digital marketplace</div>
      </div>
      <a class="nav-link active" href="#">Catalog</a>
      <a class="nav-link" href="#">Guide</a>
      <a class="nav-link" href="#">AI Studio</a>
      <a class="nav-link" href="#">Account</a>
      <div class="spacer"></div>
      <div class="search-bar">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="1.8"
            style="color: rgba(237, 232, 220, 0.35)"
          />
          <path
            d="M20 20l-3.5-3.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            style="color: rgba(237, 232, 220, 0.35)"
          />
        </svg>
        <span class="search-text">Search</span>
        <span class="kbd">⌘K</span>
      </div>
      <div class="badge">
        <svg width="8" height="8" viewBox="0 0 10 10" fill="none">
          <path
            d="M5 1l1.1 2.3L9 4l-2 1.8.5 2.5L5 7.2 2.5 8.3 3 5.8 1 4l2.9-.7L5 1z"
            fill="#C8915A"
          /></svg
        ><span class="badge-text">Claude AI</span>
      </div>
      <button class="btn-studio">Studio</button>
      <div class="avatar"></div>
    </nav>
  </body>
</html>
